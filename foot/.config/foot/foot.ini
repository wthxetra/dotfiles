shell=fish
term=foot
# login-shell=no

app-id=foot
title=foot
# locked-title=no

font=Caskaydia Cove Nerd Font:size=11
dpi-aware=no

initial-color-theme=dark
pad=5x5 center-when-maximized-and-fullscreen

[environment]
# name=value

[security]
# osc52=enabled  # disabled|copy-enabled|paste-enabled|enabled

[bell]
system=no
urgent=no
notify=no
visual=no
# command=
# command-focused=no

[desktop-notifications]
# The default:
# command=notify-send --wait --app-name ${app-id} --icon ${app-id} --category ${category} --urgency ${urgency} --expire-time ${expire-time} --hint STRING:image-path:${icon} --hint BOOLEAN:suppress-sound:${muted} --hint STRING:sound-name:${sound-name} --replace-id ${replace-id} ${action-argument} --print-id -- ${title} ${body}
# command-action-argument=--action ${action-name}=${action-label}

[scrollback]
lines=1000
multiplier=3.0
# indicator-position=relative
# indicator-format=""

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=no
# alternate-scroll-mode=yes

[touch]
# long-press-delay=400

[colors-dark]
alpha=0.65
# alpha-mode=default # Can be `default`, `matching` or `all`

background=1a1a1a
foreground=ffffff
flash=f5e0dc
flash-alpha=0.3

cursor=1e1e2e ffffff
selection-background=45475a
selection-foreground=ffffff

## Normal/regular colors (0–7)
regular0=313244
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=cba6f7
regular6=94e2d5
regular7=bac2de

## Bright colors (8–15)
bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=cba6f7
bright6=94e2d5
bright7=ffffff

[colors-light]
# Alternative color theme, see man page foot.ini(5)
# Same builtin defaults as [color], except for:
# dim-blend-towards=white

[csd]
# preferred=server
# size=26
# font=<primary font>
# color=<foreground color>
# hide-when-maximized=no
# double-click-to-maximize=yes
# border-width=0
# border-color=<csd.color>
# button-width=26
# button-color=<background color>
# button-minimize-color=<regular4>
# button-maximize-color=<regular2>
# button-close-color=<regular1>

