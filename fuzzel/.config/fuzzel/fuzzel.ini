# output=<not set>
font=Caskaydia Cove Nerd Font:size=11
dpi-aware=no
use-bold=no
message=
message-mode=wrap
prompt="❱ "
placeholder=
icons-enabled=no
# fields=filename,name,generic
password-character=*
# filter-desktop=no
match-mode=fzf
sort-result=yes
# match-counter=no
show-actions=no
terminal=foot -a '{cmd}' {cmd}
# launch-prefix=<not set>
list-executables-in-path=no

anchor=center
x-margin=0
y-margin=0
lines=15
minimal-lines=no
width=55
tabs=2
horizontal-pad=5
vertical-pad=10
inner-pad=10

layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes

cache=/tmp/.fuzzel

auto-select=no

enable-mouse=yes

[colors]
background=00000080
text=ffffffd9
message=ffffff99
prompt=ffffffff
placeholder=ffffff66
input=ffffffff
match=ffffffff
selection=ffffff30
selection-text=ffffffff
selection-match=ffffffff
counter=ffffff80
border=ffffff26

[border]
width=1
radius=5
